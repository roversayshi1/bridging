<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Today’s E-Math · Bridging</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/pwa/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico?v=6" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png?v=6" sizes="64x64" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bridging" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="/fonts/Benzim Medium/font.css?_wwcv=100" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #0a0a0a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --blue: #2563eb;
        --ok: #059669;
        --bad: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font-family: Inter, sans-serif; }
      a { text-decoration: none; color: inherit; }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 20px 24px;
      }
      .wordmark { height: 28px; width: auto; display: block; }
      .signup {
        background: #111111;
        color: #fff;
        border-radius: 999px;
        padding: 10px 18px;
        font: 600 14px/1 Inter, sans-serif;
      }
      .signup:hover { background: #000; }
      main { width: 100%; }
      .daily {
        max-width: 720px;
        margin: 0 auto;
        padding: 4px 24px 40px;
        position: relative;
      }
      .brix {
        position: absolute;
        top: -8px;
        right: 16px;
        width: 108px;
        height: auto;
        pointer-events: none;
      }
      .kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9ca3af;
        margin: 0 0 8px;
      }
      .intro { padding-right: 120px; }
      h1 {
        font: 800 36px/1.1 Inter, sans-serif;
        letter-spacing: -0.03em;
        margin: 0 0 8px;
      }
      .meta { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
      }
      .prompt {
        font: 500 20px/1.45 Inter, sans-serif;
        margin: 0 0 20px;
      }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
      textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font: 15px/1.45 Inter, sans-serif;
        color: var(--ink);
        background: #fff;
      }
      textarea:focus { outline: 2px solid rgba(17,17,17,.15); border-color: #111; }
      button[type="submit"] {
        margin-top: 12px;
        background: #111111;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font: 600 15px/1 Inter, sans-serif;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; }
      .result { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 14px; }
      .result.ok { background: rgba(5,150,105,.08); color: var(--ok); }
      .result.no { background: rgba(220,38,38,.08); color: var(--bad); }
      .err { color: var(--bad); }
      footer {
        border-top: 1px solid #eee;
        padding: 36px 24px 28px;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }
      footer .wordmark { height: 26px; margin-bottom: 14px; }
      .copy { color: #6b7280; font-size: 13px; margin: 0 0 16px; }
      .links { display: flex; gap: 20px; align-items: center; font-size: 14px; color: #111; }
      .links a:hover { opacity: 0.7; }
      .links svg { display: block; }
      @media (max-width: 640px) {
        .brix { width: 84px; right: 12px; }
        .intro { padding-right: 92px; }
        h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="/today" aria-label="Bridging today">
        <img class="wordmark" src="/brand/wordmark.png" alt="bridging" />
      </a>
      <a class="signup" href="/signup">Sign up</a>
    </nav>
    <main>
      <section class="daily">
        <img class="brix" src="/brand/brix.png" alt="" />
        <div class="intro">
          <p class="kicker">Daily E-Math</p>
          <h1>Today’s question</h1>
          <p class="meta" id="dateLine"></p>
        </div>
        <div class="card">
            <p class="prompt" id="prompt">Loading today’s question…</p>
            <form id="form">
              <label for="answer">Your answer</label>
              <textarea id="answer" name="answer" required autocomplete="off" placeholder="Type your answer"></textarea>
              <button type="submit" id="submit">Mark</button>
            </form>
            <div id="result" class="result" hidden></div>
          </div>
      </section>
    </main>
    <footer>
      <img class="wordmark" src="/brand/wordmark.png" alt="bridging" />
      <p class="copy">© 2026 BRIDGING. Not affiliated with SEAB or MOE. Designed for Singapore students.</p>
      <div class="links">
        <a href="/">Features</a>
        <a href="/">How it Works</a>
        <a href="/">FAQ</a>
        <a href="https://www.linkedin.com/company/bridgingai/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5C4.98 4.88 3.88 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V24h-4V8.5zM8.5 8.5h3.8v2.1h.05c.53-1 1.84-2.1 3.79-2.1 4.05 0 4.8 2.67 4.8 6.14V24h-4v-7.7c0-1.84-.03-4.2-2.56-4.2-2.56 0-2.95 2-2.95 4.06V24h-4V8.5z"/></svg>
        </a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script>
      const KEY = 'bridging-daily-streak';
      const promptEl = document.getElementById('prompt');
      const dateLine = document.getElementById('dateLine');
      const form = document.getElementById('form');
      const answer = document.getElementById('answer');
      const submit = document.getElementById('submit');
      const result = document.getElementById('result');
      let questionId = '';
      let date = '';

      function loadStreak() {
        try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
      }
      function saveStreak(data) {
        localStorage.setItem(KEY, JSON.stringify(data));
        const extra = dateLine.dataset.meta || '';
        dateLine.textContent = extra + (extra ? ' · ' : '') + 'streak ' + (data.count || 0);
      }
      function yesterday(iso) {
        const d = new Date(iso + 'T12:00:00+08:00');
        d.setDate(d.getDate() - 1);
        return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Singapore' }).format(d);
      }
      function typeset() {
        if (typeof renderMathInElement !== 'function') return;
        renderMathInElement(promptEl, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }

      fetch('/api/practice/daily')
        .then((r) => r.json())
        .then((data) => {
          questionId = data.questionId;
          date = data.date;
          const bits = [data.date].concat(data.difficulty ? [data.difficulty] : []);
          dateLine.dataset.meta = bits.join(' · ');
          saveStreak(loadStreak());
          promptEl.textContent = data.prompt;
          typeset();
          const s = loadStreak();
          if (s.lastDate === date) {
            result.hidden = false;
            result.className = 'result ' + (s.lastCorrect ? 'ok' : 'no');
            result.textContent = s.lastCorrect ? 'Already marked correct today.' : 'Already attempted today — you can try again, or come back tomorrow.';
            if (s.lastCorrect) form.hidden = true;
          }
        })
        .catch(() => {
          promptEl.innerHTML = '<span class="err">Could not load today’s question.</span>';
        });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submit.disabled = true;
        result.hidden = true;
        try {
          const res = await fetch('/api/practice/mark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ questionId, studentAnswer: answer.value }),
          });
          const data = await res.json();
          const ok = !!data.isCorrect;
          result.hidden = false;
          result.className = 'result ' + (ok ? 'ok' : 'no');
          result.textContent = ok
            ? (data.feedback || 'Correct.')
            : (data.feedback || data.error || 'Not yet. Try again, or come back tomorrow.');
          if (ok) {
            const s = loadStreak();
            const next = { lastDate: date, lastCorrect: true, count: 1 };
            if (s.lastDate === yesterday(date) && s.lastCorrect) next.count = (s.count || 0) + 1;
            else if (s.lastDate === date) next.count = s.count || 1;
            saveStreak(next);
            form.hidden = true;
          }
        } catch {
          result.hidden = false;
          result.className = 'result no';
          result.textContent = 'Could not mark. Check your connection.';
        } finally {
          submit.disabled = false;
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      }
    </script>
  </body>
</html>
